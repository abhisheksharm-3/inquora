name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So the migrate job can be re-run after a secret changes, without a commit.
  workflow_dispatch:
  schedule:
    # 03:00 UTC, nightly. The eval harness runs here and nowhere else.
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # Migrations are applied before anything deploys, so app code cannot ship ahead
  # of the schema it expects. Only on a push to main: a pull request must not
  # touch the database.
  migrate:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # A step-level `if` cannot read the secrets context, only env, so the
      # secret is lifted here to be testable below.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report a missing secret
        if: env.SUPABASE_DB_URL == ''
        run: |
          echo "SUPABASE_DB_URL is not set, so migrations cannot be applied and"
          echo "the 46 pgTAP assertions cannot run. Add it under Settings ->"
          echo "Secrets and variables -> Actions."
          exit 1

      - name: Apply migrations
        run: bunx supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Run the pgTAP suite
        run: bun run db:test

  # The eval harness spends provider calls, so it runs nightly and on demand
  # rather than on every pull request. It is the only thing that can say whether
  # a change to chunking, fusion or lambda made retrieval better or worse.
  eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MULTIUTILITY_API_KEY: ${{ secrets.MULTIUTILITY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report a missing secret
        if: env.SUPABASE_DB_URL == '' || env.MULTIUTILITY_API_KEY == ''
        run: |
          echo "The eval harness needs SUPABASE_DB_URL and MULTIUTILITY_API_KEY."
          exit 1

      - name: Score recall and MRR
        run: bun run eval
